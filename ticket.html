<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ticket — YumiStore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body wide-body">
  <div class="dashboard-card">
    <a href="index.html" class="logo">🌸 Yumi<span>Store</span></a>
    <div class="ticket-head">
      <h2 id="subject">Carregando...</h2>
      <span id="statusBadge" class="ticket-status">...</span>
    </div>
    <p class="small muted" id="meta"></p>

    <div id="messages" class="chat-box"></div>

    <form id="replyForm" style="margin-top:16px;">
      <label>Responder<textarea name="message" required rows="3" placeholder="Escreva sua mensagem..."></textarea></label>
      <button type="submit" class="btn-primary full">Enviar resposta</button>
    </form>

    <div class="dashboard-actions" style="margin-top:16px;">
      <a href="dashboard.html" class="btn-outline">Meu painel</a>
      <a href="support.html" class="btn-primary">Abrir outro ticket</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('redirect');
    const id = new URLSearchParams(location.search).get('id');
    const user = currentUser();

    function render() {
      const t = getTickets().find(x => x.id === id && x.userId === user.id);
      if (!t) { alert('Ticket não encontrado'); window.location.href = 'dashboard.html'; return; }
      document.getElementById('subject').textContent = t.subject;
      document.getElementById('meta').textContent = 'Aberto em ' + new Date(t.createdAt).toLocaleString('pt-BR');
      const badge = document.getElementById('statusBadge');
      badge.textContent = t.status;
      badge.className = 'ticket-status ' + (t.status === 'Resolvido' ? 'ok' : '');

      const box = document.getElementById('messages');
      box.innerHTML = t.messages.map(m => `
        <div class="chat-msg ${m.from === 'user' ? 'mine' : 'support'}">
          <div class="small muted">${m.from === 'user' ? 'Você' : 'Suporte'} • ${new Date(m.at).toLocaleString('pt-BR')}</div>
          <div>${escapeHtml(m.text)}</div>
        </div>`).join('');
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById('replyForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = e.target.message.value;
      const res = replyTicket(id, msg);
      if (res.success) { e.target.reset(); render(); }
      else alert(res.error);
    });

    render();
  </script>
</body>
</html>
