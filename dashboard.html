<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Conta — YumiStore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-grid">
  <header>
    <a href="index.html" class="logo">🌸 Yumi<span>Store</span></a>
    <div class="nav-actions">
      <a href="#" onclick="logout()" class="btn-entrar">Sair</a>
    </div>
  </header>

  <div class="container">
    <div class="auth-card" style="max-width: 600px; margin-top: 40px;">
      <h2>Bem-vindo(a), <span id="userName" style="color: var(--purple);"></span>!</h2>
      <p style="color: var(--text-muted); margin-top: 10px;">Aqui você pode acompanhar seus pedidos e abrir tickets de suporte.</p>
      
      <div style="margin-top: 30px; text-align: left; background: var(--bg-card); padding: 20px; border-radius: 8px; border: 1px solid var(--border);">
        <h3>Meus Pedidos</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 10px;">Nenhum pedido recente.</p>
      </div>

      <button class="btn-primary" style="margin-top: 20px;" onclick="window.location.href='index.html'">Voltar às compras</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const session = getSession();
    if (!session || session.role !== 'user') window.location.href = 'login.html';
    else document.getElementById('userName').innerText = session.name || session.email;
  </script>
</body>
</html>
