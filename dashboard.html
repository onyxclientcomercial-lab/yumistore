<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Conta — YumiStore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body wide-body">
  <div class="dashboard-card">
    <div class="dashboard-header">
      <a href="index.html" class="logo">🌸 Yumi<span>Store</span></a>
      <h2>Olá, <span id="username">...</span>!</h2>
    </div>

    <div class="dashboard-info">
      <div class="info-box"><span class="label">E-mail</span><strong id="email">...</strong></div>
      <div class="info-box"><span class="label">Saldo</span><strong id="balance">R$ 0,00</strong></div>
      <div class="info-box"><span class="label">Pedidos</span><strong id="ordersCount">0</strong></div>
      <div class="info-box"><span class="label">Tickets</span><strong id="ticketsCount">0</strong></div>
    </div>

    <div class="topup-box">
      <h3>Adicionar saldo (simulação de pagamento)</h3>
      <div class="topup-actions">
        <button class="btn-outline small" onclick="doTopup(10)">+ R$10</button>
        <button class="btn-outline small" onclick="doTopup(25)">+ R$25</button>
        <button class="btn-outline small" onclick="doTopup(50)">+ R$50</button>
        <button class="btn-outline small" onclick="doTopup(100)">+ R$100</button>
      </div>
    </div>

    <div class="dashboard-section">
      <h3>📦 Meus Pedidos</h3>
      <div id="ordersList" class="orders-list"></div>
    </div>

    <div class="dashboard-section">
      <h3>💬 Meus Tickets</h3>
      <div id="ticketsList" class="tickets-list"></div>
    </div>

    <div class="dashboard-actions">
      <a href="index.html" class="btn-outline">Voltar à loja</a>
      <a href="cart.html" class="btn-outline">Ver carrinho</a>
      <a href="support.html" class="btn-primary">Abrir atendimento</a>
      <button id="logoutBtn" class="btn-primary danger">Sair</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (!requireLogin()) throw new Error('redirect');

    function render() {
      const user = currentUser();
      if (!user) return window.location.href = 'login.html';
      document.getElementById('username').textContent = user.username;
      document.getElementById('email').textContent = user.email;
      document.getElementById('balance').textContent = 'R$ ' + user.balance.toFixed(2);

      const orders = getOrders().filter(o => o.userId === user.id);
      const tickets = getTickets().filter(t => t.userId === user.id);
      document.getElementById('ordersCount').textContent = orders.length;
      document.getElementById('ticketsCount').textContent = tickets.length;

      const ol = document.getElementById('ordersList');
      ol.innerHTML = orders.length ? orders.slice().reverse().map(o => `
        <div class="order-item">
          <div>
            <strong>${o.id}</strong> — <span class="status">${o.status}</span>
            <div class="small muted">${new Date(o.createdAt).toLocaleString('pt-BR')} — ${o.items.map(i => i.name + ' x' + i.qty).join(', ')}</div>
          </div>
          <span class="price">R$ ${o.total.toFixed(2)}</span>
        </div>`).join('') : '<p class="empty">Nenhum pedido ainda.</p>';

      const tl = document.getElementById('ticketsList');
      tl.innerHTML = tickets.length ? tickets.slice().reverse().map(t => `
        <a class="ticket-item" href="ticket.html?id=${t.id}">
          <div>
            <strong>${escapeHtml(t.subject)}</strong>
            <div class="small muted">${new Date(t.createdAt).toLocaleString('pt-BR')}</div>
          </div>
          <span class="ticket-status ${t.status === 'Resolvido' ? 'ok' : ''}">${t.status}</span>
        </a>`).join('') : '<p class="empty">Nenhum ticket aberto.</p>';
    }

    function doTopup(v) {
      const r = topup(v);
      if (r.success) { render(); alert('✅ Saldo adicionado!'); }
      else alert('❌ ' + r.error);
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      logout(); window.location.href = 'index.html';
    });

    render();
  </script>
</body>
</html>
