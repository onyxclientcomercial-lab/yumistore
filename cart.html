<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carrinho — YumiStore</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body wide-body">
  <div class="dashboard-card">
    <a href="/" class="logo">🌸 Yumi<span>Store</span></a>
    <h2 style="text-align:center; margin-bottom:24px;">🛒 Seu Carrinho</h2>
    <div id="cartItems"></div>
    <div class="cart-total"><span>Total:</span> <strong id="totalPrice">R$ 0,00</strong></div>
    <div class="dashboard-actions">
      <a href="/" class="btn-outline">Continuar comprando</a>
      <button id="checkoutBtn" class="btn-primary">Finalizar Compra</button>
    </div>
    <p id="msg" class="error"></p>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem('yumi_cart') || '[]');
    let products = [];

    async function load() {
      products = await (await fetch('/api/products')).json();
      render();
    }

    function render() {
      const wrap = document.getElementById('cartItems');
      if (!cart.length) {
        wrap.innerHTML = '<p class="empty">Seu carrinho está vazio.</p>';
        document.getElementById('totalPrice').textContent = 'R$ 0,00';
        return;
      }
      let total = 0;
      wrap.innerHTML = cart.map(it => {
        const p = products.find(x => x.id === it.id);
        if (!p) return '';
        total += p.price * it.qty;
        return `
          <div class="cart-row">
            <div class="cart-icon">${p.icon}</div>
            <div class="cart-info">
              <strong>${p.name}</strong>
              <div class="small muted">R$ ${p.price.toFixed(2)} cada</div>
            </div>
            <div class="qty-controls">
              <button onclick="changeQty(${p.id}, -1)">−</button>
              <span>${it.qty}</span>
              <button onclick="changeQty(${p.id}, 1)">+</button>
            </div>
            <div class="cart-sub">R$ ${(p.price * it.qty).toFixed(2)}</div>
            <button class="remove-btn" onclick="removeItem(${p.id})">✖</button>
          </div>`;
      }).join('');
      document.getElementById('totalPrice').textContent = 'R$ ' + total.toFixed(2);
    }

    function changeQty(id, delta) {
      const it = cart.find(i => i.id === id);
      if (!it) return;
      it.qty += delta;
      if (it.qty <= 0) cart = cart.filter(i => i.id !== id);
      if (it.qty > 10) it.qty = 10;
      save();
    }
    function removeItem(id) { cart = cart.filter(i => i.id !== id); save(); }
    function save() { localStorage.setItem('yumi_cart', JSON.stringify(cart)); render(); }

    document.getElementById('checkoutBtn').addEventListener('click', async () => {
      if (!cart.length) return alert('Carrinho vazio!');
      const res = await fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: cart })
      });
      if (res.status === 401) return window.location.href = '/login';
      const data = await res.json();
      if (data.success) {
        alert('✅ Compra realizada com sucesso!\nPedido: ' + data.order.id);
        localStorage.removeItem('yumi_cart');
        cart = [];
        window.location.href = '/dashboard';
      } else {
        document.getElementById('msg').textContent = data.error;
        if (data.needTopup) setTimeout(() => window.location.href = '/dashboard', 2000);
      }
    });

    load();
  </script>
</body>
</html>
