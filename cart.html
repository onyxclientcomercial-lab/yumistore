<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carrinho — YumiStore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-grid">
  <header>
    <a href="index.html" class="logo">🌸 Yumi<span>Store</span></a>
    <div class="nav-actions">
      <a href="index.html" class="btn-outline">Voltar à Loja</a>
    </div>
  </header>

  <div class="cart-page-container">
    <p class="breadcrumb">Início > <strong style="color:white;">Carrinho</strong></p>
    <h1 style="margin-bottom:5px;">Carrinhos de compras</h1>
    <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:30px;">Nesta página, você encontra os produtos adicionados ao seu carrinho.</p>

    <div class="cart-layout">
      <!-- Lado Esquerdo (Onde fica o vazio ou os itens) -->
      <div class="cart-box" id="cartItemsContainer"></div>
      
      <!-- Lado Direito (Resumo) -->
      <div class="cart-summary-box">
        <h3 style="margin-bottom:15px;">Resumo da compra</h3>
        <div id="cartSummaryBox"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
