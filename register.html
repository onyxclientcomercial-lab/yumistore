<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Criar Conta — YumiStore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-grid">
  <div class="auth-card">
    <h1 class="logo" style="justify-content:center; margin-bottom: 20px;">🌸 Yumi<span>Store</span></h1>
    <h2>Criar Conta</h2>
    <form id="regForm" style="margin-top: 20px;">
      <input type="text" id="name" placeholder="Nome de usuário" required>
      <input type="email" id="email" placeholder="E-mail" required>
      <input type="password" id="password" placeholder="Senha" required>
      <button type="submit" class="btn-primary">Cadastrar</button>
      <p id="errorMsg" style="color: #ef4444; margin-top: 10px; font-size: 0.9rem;"></p>
    </form>
    <p style="margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
      Já tem conta? <a href="login.html" style="color: var(--purple);">Entrar</a>
    </p>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const res = register(
        document.getElementById('name').value,
        document.getElementById('email').value,
        document.getElementById('password').value
      );
      if (res.success) {
        alert('Conta criada! Faça login.');
        window.location.href = 'login.html';
      } else {
        document.getElementById('errorMsg').innerText = res.error;
      }
    });
  </script>
</body>
</html>
