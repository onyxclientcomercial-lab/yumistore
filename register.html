<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Criar Conta — YumiStore</title>
  <link rel="stylesheet" href="style.css">
  <!-- SDK do Google Identity -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-grid">

  <div class="auth-container">
    <h2>Crie sua conta</h2>
    
    <form id="registerForm">
      <input type="text" id="nick" class="auth-input" placeholder="Apelido (Nick)" required>
      <input type="email" id="email" class="auth-input" placeholder="E-mail" required>
      <input type="password" id="password" class="auth-input" placeholder="Senha" required>
      <button type="submit" class="btn-primary" style="width:100%; padding:14px; font-size:1rem;">Cadastrar</button>
      <p id="errorMsg" style="color: var(--red); margin-top: 10px; font-size: 0.9rem; text-align:center;"></p>
    </form>

    <div class="auth-divider">ou continue com</div>

    <!-- Botão do Google -->
    <button class="btn-google" onclick="googleLogin()">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
      Fazer login com o Google
    </button>

    <p style="margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); text-align:center;">
      Já tem conta? <a href="login.html" style="color: var(--purple); text-decoration: underline;">Entrar</a>
    </p>
  </div>

  <script src="app.js"></script>
  <script>
    // Registro Normal com Validação Real
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nick = document.getElementById('nick').value;
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const btn = e.target.querySelector('button');
      const err = document.getElementById('errorMsg');

      err.innerText = '';
      btn.innerText = 'Verificando e-mail...';
      btn.disabled = true;

      const emailValido = await validateEmailReal(email);
      if (!emailValido) {
        err.innerText = '❌ Por favor, insira um e-mail válido que exista.';
        btn.innerText = 'Cadastrar'; btn.disabled = false;
        return;
      }

      const res = registerUser(nick, email, pass);
      if (res.success) {
        alert('✅ Conta criada com sucesso! Faça login.');
        window.location.href = 'login.html';
      } else {
        err.innerText = '❌ ' + res.error;
        btn.innerText = 'Cadastrar'; btn.disabled = false;
      }
    });

    // Função Simulada de Login com Google (Usa o Google SDK real)
    function googleLogin() {
      if (typeof google === 'undefined') {
        alert('O Google SDK ainda está carregando. Aguarde 2 segundos e tente novamente.');
        return;
      }
      // Simula a chamada (em um sistema real você usaria google.accounts.id.initialize)
      const mockEmail = prompt("Simulação do Google: Digite seu e-mail do Gmail para entrar:", "usuario@gmail.com");
      if (mockEmail && mockEmail.includes('@')) {
        let nick = mockEmail.split('@')[0];
        let users = DB.get('users', []);
        let user = users.find(u => u.email === mockEmail);
        
        if (!user) {
          // Cria conta automática se não existir (OAuth)
          users.push({ id: Date.now(), nick: nick, email: mockEmail, password: 'google-auth' });
          DB.set('users', users);
        }
        DB.set('session', { role: 'user', name: nick });
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
