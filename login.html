<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Entrar — YumiStore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-grid">
  <div style="max-width:400px; margin:100px auto; background:var(--bg-card); padding:40px; border-radius:12px; border:1px solid var(--border);">
    <h2 style="text-align:center; margin-bottom:20px;">Entrar na conta</h2>
    <form id="loginForm">
      <!-- Aceita os dois tipos de dados -->
      <input type="text" id="identifier" placeholder="E-mail ou Nick" required style="width:100%; padding:12px; margin-bottom:15px; background:var(--bg-panel); border:1px solid var(--border); color:white; border-radius:6px;">
      <input type="password" id="password" placeholder="Senha" required style="width:100%; padding:12px; margin-bottom:15px; background:var(--bg-panel); border:1px solid var(--border); color:white; border-radius:6px;">
      <button type="submit" class="btn-primary" style="width:100%;">Entrar</button>
      <p id="errorMsg" style="color: var(--red); margin-top: 10px; font-size: 0.9rem; text-align:center;"></p>
    </form>
    <p style="margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); text-align:center;">
      Não tem conta? <a href="register.html" style="color: var(--purple);">Cadastre-se</a>
    </p>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('identifier').value;
      const pass = document.getElementById('password').value;
      
      const res = login(id, pass);
      if (res.success) {
        if (res.role === 'admin') window.location.href = 'index.html'; // Admin cai na loja com painel liberado
        else window.location.href = 'dashboard.html';
      } else {
        document.getElementById('errorMsg').innerText = res.error;
      }
    });
  </script>
</body>
</html>
