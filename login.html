<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Entrar — YumiStore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <a href="index.html" class="logo">🌸 Yumi<span>Store</span></a>
    <h2>Entrar na sua conta</h2>
    <form id="loginForm">
      <label>E-mail<input type="email" name="email" required placeholder="seu@email.com"></label>
      <label>Senha<input type="password" name="password" required placeholder="••••••••"></label>
      <button type="submit" class="btn-primary full">Entrar</button>
      <p class="error" id="errorMsg"></p>
    </form>
    <p class="auth-footer">Não tem conta? <a href="register.html">Cadastre-se</a></p>
  </div>
  <script src="app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      const res = login(body.email, body.password);
      if (res.success) window.location.href = 'dashboard.html';
      else document.getElementById('errorMsg').textContent = res.error;
    });
  </script>
</body>
</html>
